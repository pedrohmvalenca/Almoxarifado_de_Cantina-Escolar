# Validação de Pull Requests: roda testes e build, sem fazer deploy.
# O deploy continua nos workflows backend.yml e frontend.yml (push na main).
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes
        run: mvn -B test
        working-directory: backend

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm install
          npm run build
        working-directory: frontend
